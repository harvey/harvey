<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Harvey Chandler"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace}@keyframes a{from{transform:translate(150px,20px)}to{transform:translate(420px,100px)}}.a{animation:a 22s ease-in-out infinite alternate}@keyframes b{from{transform:translate(720px,130px)}to{transform:translate(430px,30px)}}.b{animation:b 29s ease-in-out infinite alternate}@keyframes c{from{transform:translate(420px,160px)}to{transform:translate(760px,50px)}}.c{animation:c 37s ease-in-out infinite alternate}@keyframes k{0%,49%{opacity:1}50%,100%{opacity:0}}.k{animation:k 1.1s step-end infinite}@keyframes u{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.u{animation:u .9s ease-out both}.v{animation:u .9s .2s ease-out both}</style>
<defs><radialGradient id="g0"><stop offset="0" stop-color="#7c8cff" stop-opacity=".5"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/></radialGradient><radialGradient id="g1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".5"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#f472b6" stop-opacity=".5"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#272e3c" stroke-opacity=".5"/></pattern>
<clipPath id="frame"><rect width="840" height="150" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
